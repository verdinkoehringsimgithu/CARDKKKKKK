<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏配方编辑器 - 经典工作台版</title>
<style>
  /* 经典 Windows 98 / 2000 风格样式表 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: #008080; /* 经典视窗复古青绿色桌面 */
    font-family: "SimSun", "Tahoma", "Segoe UI", Arial, sans-serif;
    font-size: 12px;
    color: #000;
    user-select: none;
    height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 6px;
    overflow: hidden;
  }

  /* 经典主窗口容器 */
  .window {
    background: #c0c0c0;
    border: 2px outset #ffffff;
    box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  /* 经典深蓝标题栏 */
  .title-bar {
    background: linear-gradient(90deg, #000080, #1084d0);
    padding: 3px 5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-weight: bold;
    font-size: 12px;
  }
  .title-bar-text { display: flex; align-items: center; gap: 6px; }
  .title-bar-controls button {
    width: 16px;
    height: 14px;
    font-size: 9px;
    line-height: 10px;
    padding: 0;
    font-family: monospace;
    font-weight: bold;
  }

  /* 顶部菜单栏与工具栏 */
  .menu-bar {
    background: #c0c0c0;
    border-bottom: 1px solid #808080;
    padding: 2px 4px;
    display: flex;
    gap: 4px;
    align-items: center;
  }

  /* 经典 3D 按钮 */
  button, .btn {
    background: #c0c0c0;
    border: 2px outset #ffffff;
    padding: 2px 8px;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
  }
  button:active, .btn:active {
    border: 2px inset #ffffff;
    padding: 3px 7px 1px 9px;
  }
  button.small { padding: 1px 5px; font-size: 11px; }
  button.danger { color: #800000; }
  button.accent { background: #27ae60; color: #fff; font-weight: bold; }

  /* 选项卡 (TabControl) */
  .tabs {
    display: flex;
    gap: 2px;
    padding: 4px 6px 0 6px;
    background: #c0c0c0;
    border-bottom: 2px solid #808080;
    overflow-x: auto;
  }
  .tab-btn {
    background: #c0c0c0;
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #808080;
    border-bottom: none;
    padding: 3px 10px;
    cursor: pointer;
    margin-bottom: -2px;
    position: relative;
    z-index: 1;
    font-weight: normal;
  }
  .tab-btn.active {
    border-top: 2px solid #fff;
    border-left: 2px solid #fff;
    border-right: 2px solid #808080;
    border-bottom: 2px solid #c0c0c0;
    background: #c0c0c0;
    font-weight: bold;
    padding-bottom: 5px;
    z-index: 2;
  }
  .tab-btn.ref-tab {
    background: #e4e4e4;
    color: #000080;
  }
  .tab-btn.ref-tab.active {
    background: #c0c0c0;
    color: #000;
  }

  /* 主工作区域 */
  .main-content {
    flex: 1;
    padding: 6px;
    display: flex;
    overflow: hidden;
    background: #c0c0c0;
  }
  .tab-pane {
    display: none;
    width: 100%;
    height: 100%;
  }
  .tab-pane.active {
    display: flex;
    gap: 6px;
  }

  /* 左右分栏面板 */
  .panel-left {
    width: 290px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex-shrink: 0;
  }
  .panel-right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    background: #c0c0c0;
    border: 2px groove #ffffff;
    padding: 8px;
  }

  /* 凹陷文本框与列表 */
  .sunken {
    border: 2px inset #ffffff;
    background: #ffffff;
    overflow-y: auto;
  }
  input[type="text"], input[type="number"], select, textarea {
    border: 2px inset #ffffff;
    background: #ffffff;
    padding: 2px 4px;
    font-family: inherit;
    font-size: 12px;
    outline: none;
    user-select: text;
  }
  input[type="text"]:focus, input[type="number"]:focus, select:focus, textarea:focus {
    background: #ffffe0;
  }

  /* 表格和列表项 */
  .list-box {
    flex: 1;
    overflow-y: auto;
    border: 2px inset #ffffff;
    background: #fff;
  }
  .list-item {
    padding: 3px 6px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px dotted #e0e0e0;
  }
  .list-item:hover { background: #f0f0f0; }
  .list-item.selected {
    background: #000080;
    color: #ffffff;
  }

  /* 分组框 (GroupBox) */
  .group-box {
    border: 2px groove #ffffff;
    padding: 8px;
    margin-bottom: 6px;
    position: relative;
    background: #c0c0c0;
  }
  .group-box-title {
    font-weight: bold;
    color: #000080;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* 表单行 */
  .form-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 5px;
  }
  .form-row label {
    width: 90px;
    text-align: right;
    flex-shrink: 0;
  }
  .form-row input, .form-row select, .form-row textarea {
    flex: 1;
  }

  /* 标签徽章 */
  .tag-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 5px;
    border: 1px solid #707070;
    border-radius: 2px;
    font-size: 11px;
    background: #e0e0e0;
    margin-right: 4px;
    margin-bottom: 2px;
    cursor: default;
  }
  .tag-badge .close-btn {
    margin-left: 4px;
    cursor: pointer;
    font-weight: bold;
    color: #800;
  }
  .tag-badge .close-btn:hover { color: #f00; }

  /* 怀旧公式展示框 */
  .formula-display {
    background: #000000;
    color: #00ff00; /* 经典绿屏控制台字 */
    font-family: "Courier New", monospace;
    font-size: 13px;
    font-weight: bold;
    padding: 8px;
    border: 2px inset #ffffff;
    user-select: text;
    white-space: pre-wrap;
    word-break: break-all;
  }

  /* 底部状态栏 */
  .status-bar {
    background: #c0c0c0;
    border-top: 2px groove #ffffff;
    display: flex;
    padding: 2px 4px;
    gap: 4px;
    font-size: 11px;
  }
  .status-pane {
    border: 1px inset #ffffff;
    padding: 1px 6px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .status-pane.fixed { flex: none; width: 170px; }
</style>
</head>
<body>

<div class="window">
  <!-- 标题栏 -->
  <div class="title-bar">
        <div class="title-bar-text">
      <span>🛠️ 游戏配方与工坊编辑器 <span style="font-size:10px; color:#ffff80;">v1.3 [怀旧经典·副产线与能力检定全功能版]</span></span>
      <span style="font-size:10px; color:#c0ffc0; margin-left:12px;">★ 全面支持能力门槛/折算率/分支产出 (若显示旧界面请按 Ctrl+F5 刷新)</span>
    </div>
    <div class="title-bar-controls">
      <button onclick="alert('包含主编辑功能（物品、复用标签、物品作为场所、在场个体、不限量等式）与三大经典游戏（热带岛屿、奇幻森林、别冻僵）独立配方参考展台。')">?</button>
    </div>
  </div>

  <!-- 顶部菜单/快捷工具栏 -->
  <div class="menu-bar">
    <button onclick="newDatabase()">新建库</button>
    <button onclick="loadDefaultSample()">载入预设示例</button>
    <button onclick="importJsonFile()">从 JSON 导入...</button>
    <button onclick="exportJsonFile()">导出保存 JSON</button>
    <div style="flex: 1;"></div>
    <button onclick="validateDatabase(true)">完整性校验</button>
    <input type="file" id="fileInput" accept=".json" style="display:none;" onchange="handleFileSelected(event)">
  </div>

  <!-- 选项卡按钮栏 -->
  <div class="tabs">
    <!-- 核心功能区 -->
    <button class="tab-btn active" onclick="switchTab(0)" id="tabBtn0">物品库 (0)</button>
    <button class="tab-btn" onclick="switchTab(1)" id="tabBtn1">复用标签池 (0)</button>
    <button class="tab-btn" onclick="switchTab(2)" id="tabBtn2">能力定义 (0)</button>
    <button class="tab-btn" onclick="switchTab(3)" id="tabBtn3">合成场所 (0)</button>
    <button class="tab-btn" onclick="switchTab(4)" id="tabBtn4">配方管理 (0)</button>
    <button class="tab-btn" onclick="switchTab(5)" id="tabBtn5">副产线 (0)</button>
    <button class="tab-btn" onclick="switchTab(6)" id="tabBtn6">概览与校验</button>

    <!-- 独立拆包游戏配方展示区（不影响核心功能） -->
    <button class="tab-btn ref-tab" onclick="switchTab(7)" id="tabBtn7">🏝️ 热带岛屿参考 (214)</button>
    <button class="tab-btn ref-tab" onclick="switchTab(8)" id="tabBtn8">🌲 奇幻森林参考 (400)</button>
    <button class="tab-btn ref-tab" onclick="switchTab(9)" id="tabBtn9">❄️ 别冻僵参考 (177)</button>
  </div>

  <!-- 主工作区 -->
  <div class="main-content">

    <!-- 选项卡 0: 物品库 -->
    <div class="tab-pane active" id="tab0">
      <div class="panel-left">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="itemSearch" placeholder="搜索物品名称/ID/分类..." oninput="renderItemList()">
          <button class="small" onclick="document.getElementById('itemSearch').value=''; renderItemList();">清空</button>
        </div>
        <div class="list-box" id="itemListBox"></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button onclick="addNewItem()" style="flex:1;">+ 新建物品</button>
          <button onclick="deleteSelectedItem()" class="danger" style="width:50px;">删除</button>
        </div>
      </div>
      <div class="panel-right" id="itemDetailPanel">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个物品</div>
      </div>
    </div>

    <!-- 选项卡 1: 复用标签池 -->
    <div class="tab-pane" id="tab1">
      <div class="panel-left">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="tagSearch" placeholder="搜索标签名称/ID..." oninput="renderTagList()">
          <button class="small" onclick="document.getElementById('tagSearch').value=''; renderTagList();">清空</button>
        </div>
        <div class="list-box" id="tagListBox"></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button onclick="addNewTag()" style="flex:1;">+ 新建标签</button>
          <button onclick="deleteSelectedTag()" class="danger" style="width:50px;">删除</button>
        </div>
      </div>
      <div class="panel-right" id="tagDetailPanel">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个标签</div>
      </div>
    </div>

    <!-- 选项卡 2: 能力定义池 -->
    <div class="tab-pane" id="tab2">
      <div class="panel-left">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="abilitySearch" placeholder="搜索能力名称/ID/分类..." oninput="renderAbilityList()">
          <button class="small" onclick="document.getElementById('abilitySearch').value=''; renderAbilityList();">清空</button>
        </div>
        <div class="list-box" id="abilityListBox"></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button onclick="addNewAbility()" style="flex:1;">+ 新建能力</button>
          <button onclick="deleteSelectedAbility()" class="danger" style="width:50px;">删除</button>
        </div>
      </div>
      <div class="panel-right" id="abilityDetailPanel">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个能力定义</div>
      </div>
    </div>

    <!-- 选项卡 3: 合成场所 -->
    <div class="tab-pane" id="tab3">
      <div class="panel-left">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="locSearch" placeholder="搜索场所名称/ID..." oninput="renderLocList()">
          <button class="small" onclick="document.getElementById('locSearch').value=''; renderLocList();">清空</button>
        </div>
        <div class="list-box" id="locListBox"></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button onclick="addNewLocation(0)" style="flex:1;">+ 独立场所</button>
          <button onclick="promptAddItemAsLocation()" style="flex:1;">+ 物品设为场所</button>
          <button onclick="deleteSelectedLoc()" class="danger" style="width:50px;">删除</button>
        </div>
      </div>
      <div class="panel-right" id="locDetailPanel">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个合成场所</div>
      </div>
    </div>

    <!-- 选项卡 4: 配方管理 -->
    <div class="tab-pane" id="tab4">
      <div class="panel-left" style="width: 300px;">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="recipeSearch" placeholder="搜索配方名称/ID..." oninput="renderRecipeList()">
          <select id="recipeTypeFilter" onchange="renderRecipeList()" style="width:85px;">
            <option value="all">全部类型</option>
            <option value="0">标准合成</option>
            <option value="1">自身转变</option>
          </select>
        </div>
        <div class="list-box" id="recipeListBox"></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button onclick="addNewRecipe(0)" style="flex:1;">+ 合成配方</button>
          <button onclick="addNewRecipe(1)" style="flex:1;">+ 转变配方</button>
          <button onclick="deleteSelectedRecipe()" class="danger" style="width:50px;">删除</button>
        </div>
      </div>
      <div class="panel-right" id="recipeDetailPanel">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个配方</div>
      </div>
    </div>

    <!-- 选项卡 5: 副产线管理（伴生修正、概率覆盖与产出拦截） -->
    <div class="tab-pane" id="tab5">
      <div class="panel-left">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="auxSearch" placeholder="搜索副产线名称/ID..." oninput="renderAuxList()">
          <button class="small" onclick="document.getElementById('auxSearch').value=''; renderAuxList();">清空</button>
        </div>
        <div class="list-box" id="auxListBox"></div>
        <div style="display:flex; gap:4px; margin-top:4px;">
          <button onclick="addNewAux()" style="flex:1;">+ 新建副产线</button>
          <button onclick="deleteSelectedAux()" class="danger" style="width:50px;">删除</button>
        </div>
      </div>
      <div class="panel-right" id="auxDetailPanel">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一条副产线</div>
      </div>
    </div>

    <!-- 选项卡 6: 完整性校验与概览 -->
    <div class="tab-pane" id="tab6">
      <div class="panel-right" style="width:100%;" id="overviewPanel"></div>
    </div>

    <!-- 选项卡 7: 独立参考 - 热带岛屿 -->
    <div class="tab-pane" id="tab7">
      <div class="panel-left" style="width: 310px;">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="refSearch7" placeholder="搜索热带岛屿配方/产物..." oninput="renderRefList(7)">
          <select id="refLocFilter7" onchange="renderRefList(7)" style="width:105px;">
            <option value="all">全部场所</option>
          </select>
        </div>
        <div class="list-box" id="refListBox7"></div>
      </div>
      <div class="panel-right" id="refDetailPanel7">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择一条配方查看详细等式</div>
      </div>
    </div>

    <!-- 选项卡 8: 独立参考 - 奇幻森林 -->
    <div class="tab-pane" id="tab8">
      <div class="panel-left" style="width: 310px;">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="refSearch8" placeholder="搜索奇幻森林配方/产物..." oninput="renderRefList(8)">
          <select id="refLocFilter8" onchange="renderRefList(8)" style="width:105px;">
            <option value="all">全部场所</option>
          </select>
        </div>
        <div class="list-box" id="refListBox8"></div>
      </div>
      <div class="panel-right" id="refDetailPanel8">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择一条配方查看详细等式</div>
      </div>
    </div>

    <!-- 选项卡 9: 独立参考 - 别冻僵 -->
    <div class="tab-pane" id="tab9">
      <div class="panel-left" style="width: 310px;">
        <div class="form-row" style="margin-bottom:2px;">
          <input type="text" id="refSearch9" placeholder="搜索别冻僵配方/产物..." oninput="renderRefList(9)">
          <select id="refLocFilter9" onchange="renderRefList(9)" style="width:105px;">
            <option value="all">全部场所</option>
          </select>
        </div>
        <div class="list-box" id="refListBox9"></div>
      </div>
      <div class="panel-right" id="refDetailPanel9">
        <div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择一条配方查看详细等式</div>
      </div>
    </div>

  </div>

  <!-- 底部状态栏 -->
  <div class="status-bar">
    <div class="status-pane" id="statusMessage">就绪。欢迎使用游戏配方编辑器。</div>
    <div class="status-pane fixed" id="statusCounts">物品:0 | 标签:0 | 配方:0</div>
    <div class="status-pane fixed" id="statusStorage">自动本地保存已开启</div>
  </div>
</div>

function getRefCardName(refDb, id) {
  if (!id) return "";
  const it = (refDb.Items || []).find(i => i.Id === id);
  return it ? it.Name : id;
}

function initRefDatabases() {
  REF_DATABASES[7] = DATA_TROPICAL;
  REF_DATABASES[8] = DATA_FANTASY;
  REF_DATABASES[9] = DATA_FREEZE;

  [7, 8, 9].forEach(tIdx => {
    const filterSelect = document.getElementById(`refLocFilter${tIdx}`);
    if (filterSelect && REF_DATABASES[tIdx]) {
      filterSelect.innerHTML = '<option value="all">-- 所有场所 --</option>';
      (REF_DATABASES[tIdx].Locations || []).forEach(loc => {
        const opt = document.createElement("option");
        opt.value = loc.Id;
        opt.textContent = loc.Name;
        filterSelect.appendChild(opt);
      });
    }
  });

  document.getElementById("tabBtn7").textContent = `🏝️ 热带岛屿参考 (${REF_DATABASES[7].Recipes.length})`;
  document.getElementById("tabBtn8").textContent = `🌲 奇幻森林参考 (${REF_DATABASES[8].Recipes.length})`;
  document.getElementById("tabBtn9").textContent = `❄️ 别冻僵参考 (${REF_DATABASES[9].Recipes.length})`;
}

function autoSave() {
  localStorage.setItem("recipe_editor_db", JSON.stringify(db));
  updateCounts();
}

function setStatus(msg) {
  document.getElementById("statusMessage").textContent = msg;
}

function updateCounts() {
  const itemLen = db.Items ? db.Items.length : 0;
  const tagLen = db.Tags ? db.Tags.length : 0;
  const abLen = db.Abilities ? db.Abilities.length : 0;
  const locLen = db.Locations ? db.Locations.length : 0;
  const recipeLen = db.Recipes ? db.Recipes.length : 0;
  const auxLen = db.AuxiliaryLines ? db.AuxiliaryLines.length : 0;

  document.getElementById("tabBtn0").textContent = `物品库 (${itemLen})`;
  document.getElementById("tabBtn1").textContent = `复用标签池 (${tagLen})`;
  document.getElementById("tabBtn2").textContent = `能力定义 (${abLen})`;
  document.getElementById("tabBtn3").textContent = `合成场所 (${locLen})`;
  document.getElementById("tabBtn4").textContent = `配方管理 (${recipeLen})`;
  document.getElementById("tabBtn5").textContent = `副产线 (${auxLen})`;

  const statusCounts = document.getElementById("statusCounts");
  if (statusCounts) {
    statusCounts.textContent = `物品:${itemLen} | 标签:${tagLen} | 能力:${abLen} | 场所:${locLen} | 配方:${recipeLen} | 副产线:${auxLen}`;
  }
}

function refreshAll() {
  renderItemList();
  renderTagList();
  renderAbilityList();
  renderLocList();
  renderRecipeList();
  renderAuxList();
  renderOverview();
  renderRefList(7);
  renderRefList(8);
  renderRefList(9);
  updateCounts();
}

function switchTab(index) {
  for (let i = 0; i <= 9; i++) {
    const pane = document.getElementById(`tab${i}`);
    const btn = document.getElementById(`tabBtn${i}`);
    if (pane) pane.classList.remove("active");
    if (btn) btn.classList.remove("active");
  }
  const targetPane = document.getElementById(`tab${index}`);
  const targetBtn = document.getElementById(`tabBtn${index}`);
  if (targetPane) targetPane.classList.add("active");
  if (targetBtn) targetBtn.classList.add("active");

  if (index === 2) { renderAbilityList(); renderAbilityDetail(); }
  if (index === 5) { renderAuxList(); renderAuxDetail(); }
  if (index === 6) renderOverview();
  if (index >= 7 && index <= 9) renderRefList(index);
}

function renderRefList(tabIndex) {
  const refDb = REF_DATABASES[tabIndex];
  if (!refDb) return;

  const box = document.getElementById(`refListBox${tabIndex}`);
  const searchInput = document.getElementById(`refSearch${tabIndex}`);
  const locFilter = document.getElementById(`refLocFilter${tabIndex}`);
  if (!box || !searchInput || !locFilter) return;

  box.innerHTML = "";
  const filter = (searchInput.value || "").toLowerCase();
  const locVal = locFilter.value;

  refDb.Recipes.forEach((r, idx) => {
    if (locVal !== "all" && r.LocationId !== locVal) return;
    if (filter) {
      const match = (r.Name && r.Name.toLowerCase().includes(filter)) ||
                    (r.Id && r.Id.toLowerCase().includes(filter)) ||
                    (r.Description && r.Description.toLowerCase().includes(filter));
      if (!match) return;
    }

    const div = document.createElement("div");
    div.className = "list-item" + (refSelectedIndices[tabIndex] === idx ? " selected" : "");
    const locObj = (refDb.Locations || []).find(l => l.Id === r.LocationId);

    div.innerHTML = `
      <span>${r.Name}</span>
      <span style="font-size:10px; opacity:0.8;">
        <span style="background:${r.Type===1?'#e67e22':'#2980b9'}; color:#fff; padding:0 3px;">${r.Type===1?'转变':'合成'}</span>

    div.onclick = () => {
      refSelectedIndices[tabIndex] = idx;
      renderRefList(tabIndex);

    };

  });

  if (refSelectedIndices[tabIndex] >= 0 && refSelectedIndices[tabIndex] < refDb.Recipes.length) {

    document.getElementById(`refDetailPanel${tabIndex}`).innerHTML = '<div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择一条配方查看详细等式</div>';

// 一键将参考配方复制到策划的正式数据库中
function importRefRecipeToMyDb(tabIndex, recipeIdx) {
  const refDb = REF_DATABASES[tabIndex];
  if (!refDb) return;
  const r = refDb.Recipes[recipeIdx];

  if (!db.Items) db.Items = [];
  if (!db.Locations) db.Locations = [];
  if (!db.Recipes) db.Recipes = [];

  // 1. 确保发生场所存在
  let targetLocId = "";
  if (r.LocationId) {
    const refLoc = (refDb.Locations || []).find(l => l.Id === r.LocationId);
    if (refLoc) {
      targetLocId = refLoc.Id;
      if (!db.Locations.some(l => l.Id === targetLocId)) {
        db.Locations.push({
          Id: targetLocId,
          Name: refLoc.Name,
          Description: refLoc.Description || `来自《${refDb.DatabaseName}》的参考工位`,
          SourceType: refLoc.SourceType || 0,
          BoundItemId: refLoc.BoundItemId || "",
          Capacity: refLoc.Capacity || 2,
          FeatureTags: refLoc.FeatureTags || []
        });
      }
    }
  }

  // 2. 级联复制所需物品
  function ensureItem(refId) {
    if (!refId) return "";
    let item = db.Items.find(i => i.Id === refId);
    if (!item) {
      const refItem = (refDb.Items || []).find(i => i.Id === refId);
      const name = refItem ? refItem.Name : refId;
      const desc = refItem ? refItem.Description : "";
      const cat = refItem ? refItem.Category : "参考导入";
      item = {
        Id: refId,
        Name: name,
        Category: cat,
        Description: desc,
        MaxStack: refItem ? refItem.MaxStack : 20,
        TagIds: refItem ? refItem.TagIds : [],
        Properties: []
      };
      db.Items.push(item);
    }
    return item.Id;
  }

  // 复制配方
  let newRecipeId = r.Id;
  let counter = 1;
  while (db.Recipes.some(rec => rec.Id === newRecipeId)) {
    newRecipeId = `${r.Id}_copy_${counter++}`;
  }

  const cloned = {
    Id: newRecipeId,
    Name: r.Name,
    Type: r.Type,
    LocationId: targetLocId,
    DurationMinutes: r.DurationMinutes,
    Description: r.Description || `借用自《${refDb.DatabaseName}》`,
    Operators: [],
    Inputs: [],
    Outputs: [],
    SourceItemId: "",
    SourceQuantity: 1,
    TransformationConditions: [],
    TargetItemId: "",
    TargetQuantity: 1,
    Byproducts: []
  };

  if (r.Type === 1) {
    if (r.Inputs && r.Inputs[0]) {
      cloned.SourceItemId = ensureItem(r.Inputs[0].TargetId);
      cloned.SourceQuantity = r.Inputs[0].Quantity || 1;
    }
    const tgtId = r.TargetTransformItemId || (r.Outputs && r.Outputs[0] ? r.Outputs[0].ItemId : "");
    cloned.TargetItemId = ensureItem(tgtId);
    cloned.TargetQuantity = 1;
    if (r.Outputs && r.Outputs.length > 0) {
      cloned.Byproducts = r.Outputs.map(o => ({
        ItemId: ensureItem(o.ItemId),
        Quantity: o.Quantity,
        Probability: o.Probability || 1.0
      }));
    }
  } else {
    cloned.Inputs = (r.Inputs || []).map(inp => ({
      TargetId: ensureItem(inp.TargetId),
      MatchType: inp.MatchType || 0,
      Quantity: inp.Quantity,
      Consume: inp.Consume !== false,
      Note: inp.Note || ""
    }));
    cloned.Outputs = (r.Outputs || []).map(outp => ({
      ItemId: ensureItem(outp.ItemId),
      Quantity: outp.Quantity,
      Probability: outp.Probability || 1.0,
      IsBonus: outp.IsBonus || false
    }));
  }

  db.Recipes.push(cloned);
  autoSave();
  alert(`成功将配方【${cloned.Name}】及关联依赖物品导入到您的配方库中！`);
  switchTab(3);
}

function updateItemField(key, val) {
  if (selectedItemIdx >= 0 && db.Items[selectedItemIdx]) {
    db.Items[selectedItemIdx][key] = val;
    autoSave();
    renderItemList();
  }
}
function addNewItem() {
  if (!db.Items) db.Items = [];
  const newId = "item_" + (db.Items.length + 1);
  db.Items.push({ Id: newId, Name: "新物品", Category: "材料", MaxStack: 99, TagIds: [], Properties: [] });
  selectedItemIdx = db.Items.length - 1;
  autoSave();
  refreshAll();
}
function deleteSelectedItem() {
  if (selectedItemIdx >= 0 && confirm("确定删除该物品吗？")) {
    db.Items.splice(selectedItemIdx, 1);
    selectedItemIdx = -1;
    autoSave();
    refreshAll();
  }
}
function addItemTag(tid) {
  const item = db.Items[selectedItemIdx];
  if (!item.TagIds) item.TagIds = [];
  if (!item.TagIds.includes(tid)) {
    item.TagIds.push(tid);
    autoSave();
    renderItemDetail();
  }
}
function removeItemTag(tid) {
  const item = db.Items[selectedItemIdx];
  if (item && item.TagIds) {
    item.TagIds = item.TagIds.filter(t => t !== tid);
    autoSave();
    renderItemDetail();
  }
}
function quickCreateAndBindTag() {
  const input = document.getElementById("quickTagName");
  const name = (input.value || "").trim();
  if (!name) return;
  const tagId = "tag_" + name.toLowerCase();
  if (!db.Tags) db.Tags = [];
  let tag = db.Tags.find(t => t.Id === tagId);
  if (!tag) {
    tag = { Id: tagId, Name: name, ColorHex: "#3498DB", Category: "常规", Description: "" };
    db.Tags.push(tag);
  }
  addItemTag(tag.Id);
  input.value = "";
  refreshAll();
}
function makeItemAsLocation(itemId) {
  const item = db.Items.find(i => i.Id === itemId);
  if (!item) return;
  if (!db.Locations) db.Locations = [];
  const locId = "loc_" + item.Id;
  if (!db.Locations.some(l => l.Id === locId)) {
    db.Locations.push({
      Id: locId,
      Name: item.Name,
      Description: item.Description || "",
      SourceType: 1,
      BoundItemId: item.Id,
      Capacity: 1,
      FeatureTags: []
    });
    autoSave();
    refreshAll();
    renderItemDetail();
    setStatus(`已成功将物品 [${item.Name}] 设为合成场所！`);
  }
}
function removeLocationByBoundItem(itemId) {
  if (confirm("确定取消该物品的场所身份吗？")) {
    db.Locations = db.Locations.filter(l => !(l.SourceType === 1 && l.BoundItemId === itemId));
    autoSave();
    refreshAll();
    renderItemDetail();
  }
}
function jumpToLocation(locId) {
  const idx = db.Locations.findIndex(l => l.Id === locId);
  if (idx >= 0) {
    selectedLocIdx = idx;
    switchTab(2);
    renderLocList();
  }
}
function addItemProp() {
  const item = db.Items[selectedItemIdx];
  if (!item.Properties) item.Properties = [];
  item.Properties.push({ Key: "prop", Value: "100" });
  autoSave();
  renderItemDetail();
}
function updateItemPropKey(idx, val) {
  db.Items[selectedItemIdx].Properties[idx].Key = val;
  autoSave();
}
function updateItemPropVal(idx, val) {
  db.Items[selectedItemIdx].Properties[idx].Value = val;
  autoSave();
}
function deleteItemProp(idx) {
  db.Items[selectedItemIdx].Properties.splice(idx, 1);
  autoSave();
  renderItemDetail();
}

// ==================== 选项卡 1: 标签池管理 ====================
function renderTagList() {
  const box = document.getElementById("tagListBox");
  if (!box) return;
  box.innerHTML = "";
  const filter = (document.getElementById("tagSearch").value || "").toLowerCase();

  if (!db.Tags) db.Tags = [];
  db.Tags.forEach((tag, idx) => {
    if (filter) {
      const match = (tag.Name && tag.Name.toLowerCase().includes(filter)) ||
                    (tag.Id && tag.Id.toLowerCase().includes(filter));
      if (!match) return;
    }

    const div = document.createElement("div");
    div.className = "list-item" + (selectedTagIdx === idx ? " selected" : "");
    const count = db.Items ? db.Items.filter(it => it.TagIds && it.TagIds.includes(tag.Id)).length : 0;

    div.innerHTML = `
      <span><span style="display:inline-block; width:10px; height:10px; background:${tag.ColorHex || '#999'}; margin-right:4px;"></span>${tag.Name || tag.Id}</span>
      <span style="font-size:10px; opacity:0.8;">${count}用</span>
    `;
    div.onclick = () => { selectedTagIdx = idx; renderTagList(); renderTagDetail(); };
    box.appendChild(div);
  });

  if (selectedTagIdx >= 0 && selectedTagIdx < db.Tags.length) {
    renderTagDetail();
  } else {
    document.getElementById("tagDetailPanel").innerHTML = '<div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个标签</div>';
  }
}

function renderTagDetail() {
  const panel = document.getElementById("tagDetailPanel");
  if (selectedTagIdx < 0 || selectedTagIdx >= db.Tags.length) return;
  const tag = db.Tags[selectedTagIdx];

  const usedItems = db.Items ? db.Items.filter(it => it.TagIds && it.TagIds.includes(tag.Id)) : [];
  let itemsHtml = "";
  usedItems.forEach(it => {
    itemsHtml += `<span class="tag-badge" style="cursor:pointer;" onclick="jumpToItem('${it.Id}')">${it.Name} (${it.Id})</span>`;
  });

  panel.innerHTML = `
    <div class="group-box">
      <div class="group-box-title">标签属性设置</div>
      <div class="form-row">
        <label>标签 ID:</label>
        <input type="text" value="${tag.Id || ''}" onchange="updateTagField('Id', this.value)">
      </div>
      <div class="form-row">
        <label>显示名称:</label>
        <input type="text" value="${tag.Name || ''}" onchange="updateTagField('Name', this.value)">
      </div>
      <div class="form-row">
        <label>标签分类:</label>
        <input type="text" value="${tag.Category || ''}" onchange="updateTagField('Category', this.value)">
      </div>
      <div class="form-row">
        <label>代表颜色:</label>
        <input type="color" value="${tag.ColorHex || '#3498DB'}" onchange="updateTagField('ColorHex', this.value)" style="width:60px; height:24px; padding:0;">
      </div>
      <div class="form-row">
        <label>说明备注:</label>
        <textarea rows="2" onchange="updateTagField('Description', this.value)">${tag.Description || ''}</textarea>
      </div>
    </div>

    <div class="group-box">
      <div class="group-box-title">引用此标签的物品 (${usedItems.length})</div>
      <div>${itemsHtml || '<span style="color:#666; font-size:11px;">当前暂无物品引用该标签</span>'}</div>
    </div>
  `;
}

function updateTagField(key, val) {
  if (selectedTagIdx >= 0 && db.Tags[selectedTagIdx]) {
    db.Tags[selectedTagIdx][key] = val;
    autoSave();
    renderTagList();
  }
}
function addNewTag() {
  if (!db.Tags) db.Tags = [];
  const newId = "tag_" + (db.Tags.length + 1);
  db.Tags.push({ Id: newId, Name: "新标签", ColorHex: "#3498DB", Category: "通用", Description: "" });
  selectedTagIdx = db.Tags.length - 1;
  autoSave();
  refreshAll();
}
function deleteSelectedTag() {
  if (selectedTagIdx >= 0 && confirm("确定删除该标签吗？")) {
    db.Tags.splice(selectedTagIdx, 1);
    selectedTagIdx = -1;
    autoSave();
    refreshAll();
  }
}
function jumpToItem(itemId) {
  const idx = db.Items.findIndex(i => i.Id === itemId);
  if (idx >= 0) {
    selectedItemIdx = idx;
    switchTab(0);
    renderItemList();
  }
}

// ==================== 选项卡 2: 合成场所 ====================
function renderLocList() {
  const box = document.getElementById("locListBox");

  const filter = (document.getElementById("locSearch").value || "").toLowerCase();

  if (!db.Locations) db.Locations = [];
  db.Locations.forEach((loc, idx) => {
    if (filter) {
      const match = (loc.Name && loc.Name.toLowerCase().includes(filter)) ||
                    (loc.Id && loc.Id.toLowerCase().includes(filter));
      if (!match) return;
    }

    const div = document.createElement("div");
    div.className = "list-item" + (selectedLocIdx === idx ? " selected" : "");

    div.innerHTML = `

      <span style="font-size:10px; opacity:0.8;">

}

        <select onchange="updateLocField('BoundItemId', this.value)">${opts}</select>

      </div>

      </div>
      <div class="form-row">
        <label>场所名称:</label>
        <input type="text" value="${loc.Name || ''}" onchange="updateLocField('Name', this.value)">
      </div>
      <div class="form-row">
        <label>来源类型:</label>
        <select onchange="updateLocField('SourceType', parseInt(this.value)); renderLocDetail();">
          <option value="0" ${loc.SourceType === 0 ? 'selected' : ''}>独立场所 (如 随身、祭坛、海滩)</option>
          <option value="1" ${loc.SourceType === 1 ? 'selected' : ''}>物品作为场所 (如 制作出的篝火、高炉、工作台卡牌)</option>
        </select>
      </div>
      ${itemSelectHtml}
      <div class="form-row">
        <label>工位容量:</label>
        <input type="number" value="${loc.Capacity || 1}" min="1" onchange="updateLocField('Capacity', parseInt(this.value)||1)">
      </div>
      <div class="form-row">
        <label>单次损耗度:</label>
        <input type="number" value="${loc.DurabilityCost || 0}" min="0" title="工位设施磨损/耐久损耗(0=暂不设)" onchange="updateLocField('DurabilityCost', parseInt(this.value)||0)">
      </div>
      <div style="font-size:10px; color:#666; margin-bottom:6px; margin-left:85px;">
        * 工位设施本质具备耐久损耗/燃料消耗机制，当前暂不设损耗值请保持为 0。
      </div>
      <div class="form-row">
        <label>说明备注:</label>
        <textarea rows="2" onchange="updateLocField('Description', this.value)">${loc.Description || ''}</textarea>
      </div>
    </div>

    <div class="group-box">
      <div class="group-box-title">在此场所发生的配方 (${recipesHere.length})</div>
      <div>${recipesHtml || '<div style="color:#666; font-size:11px;">暂无配方指定在此场所发生</div>'}</div>

function updateLocField(key, val) {
  if (selectedLocIdx >= 0 && db.Locations[selectedLocIdx]) {
    db.Locations[selectedLocIdx][key] = val;
    autoSave();
    renderLocList();
  }
}
function addNewLocation(sourceType) {
  if (!db.Locations) db.Locations = [];
  const newId = "loc_" + (db.Locations.length + 1);
  db.Locations.push({ Id: newId, Name: "新合成场所", Description: "", SourceType: sourceType, BoundItemId: "", Capacity: 1, DurabilityCost: 0, FeatureTags: [] });
  selectedLocIdx = db.Locations.length - 1;
  autoSave();
  refreshAll();
}
function promptAddItemAsLocation() {
  if (!db.Items || db.Items.length === 0) {
    alert("当前物品库为空，请先在物品库中创建物品！");
    return;
  }
  const itemNames = db.Items.map(i => `${i.Name} (${i.Id})`).join("\n");
  const chosen = prompt("请输入要作为场所的物品 ID：\n可选物品列表：\n" + itemNames);
  if (!chosen) return;
  const target = db.Items.find(i => i.Id === chosen || i.Name === chosen);
  if (target) {
    makeItemAsLocation(target.Id);
  } else {
    alert("未找到该物品！");
  }
}
function deleteSelectedLoc() {
  if (selectedLocIdx >= 0 && confirm("确定删除该场所吗？")) {
    db.Locations.splice(selectedLocIdx, 1);
    selectedLocIdx = -1;
    autoSave();
    refreshAll();
  }
}
function jumpToRecipe(recipeId) {

  if (idx >= 0) {
    selectedRecipeIdx = idx;
    switchTab(3);
    renderRecipeList();
  }
}

// ==================== 选项卡 3: 配方管理 ====================
function renderRecipeList() {
  const box = document.getElementById("recipeListBox");
  if (!box) return;
  box.innerHTML = "";
  const filter = (document.getElementById("recipeSearch").value || "").toLowerCase();
  const typeFilter = document.getElementById("recipeTypeFilter").value;

  if (!db.Recipes) db.Recipes = [];
  db.Recipes.forEach((r, idx) => {
    if (typeFilter !== "all" && r.Type !== parseInt(typeFilter)) return;
    if (filter) {
      const match = (r.Name && r.Name.toLowerCase().includes(filter)) ||
                    (r.Id && r.Id.toLowerCase().includes(filter));
      if (!match) return;
    }

    const div = document.createElement("div");
    div.className = "list-item" + (selectedRecipeIdx === idx ? " selected" : "");
    const isTrans = r.Type === 1;

    div.innerHTML = `
      <span>${r.Name || r.Id}</span>
      <span style="font-size:10px; opacity:0.8;">
        ${isTrans ? '<span style="background:#e67e22; color:#fff; padding:0 3px;">转变</span>' : '<span style="background:#2980b9; color:#fff; padding:0 3px;">合成</span>'}
      </span>
    `;
    div.onclick = () => { selectedRecipeIdx = idx; renderRecipeList(); renderRecipeDetail(); };
    box.appendChild(div);
  });

  if (selectedRecipeIdx >= 0 && selectedRecipeIdx < db.Recipes.length) {
    renderRecipeDetail();
  } else {
    document.getElementById("recipeDetailPanel").innerHTML = '<div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一个配方</div>';
  }
}

function renderRecipeDetail() {
  const panel = document.getElementById("recipeDetailPanel");
  if (selectedRecipeIdx < 0 || selectedRecipeIdx >= db.Recipes.length) return;
  const r = db.Recipes[selectedRecipeIdx];

  let locOptionsHtml = '<option value="">随身 / 徒手 (无特定场所限制)</option>';
  if (db.Locations) {
    db.Locations.forEach(loc => {
      const typeStr = loc.SourceType === 1 ? '[物品场所] ' : '';
      locOptionsHtml += `<option value="${loc.Id}" ${loc.Id === r.LocationId ? 'selected' : ''}>${typeStr}${loc.Name} (${loc.Id})</option>`;
    });
  }

  let operatorsHtml = "";
  if (r.Operators && r.Operators.length > 0) {
    r.Operators.forEach((op, opIdx) => {
      operatorsHtml += `
        <div class="form-row" style="margin-bottom:2px;">
          <select onchange="updateOperatorField(${opIdx}, 'MatchType', parseInt(this.value)); renderRecipeDetail();" style="width:75px;">
            <option value="0" ${op.MatchType === 0 ? 'selected' : ''}>具体物品</option>
            <option value="1" ${op.MatchType === 1 ? 'selected' : ''}>按标签</option>
          </select>
          ${op.MatchType === 0 ? getItemSelectHtml(op.TargetId, (val) => `updateOperatorField(${opIdx}, 'TargetId', '${val}')`) : getTagSelectHtml(op.TargetId, (val) => `updateOperatorField(${opIdx}, 'TargetId', '${val}')`)}

          <input type="text" value="${op.Role || ''}" placeholder="分工角色 (如 主工匠)" onchange="updateOperatorField(${opIdx}, 'Role', this.value)" style="width:100px;">
          <button class="small danger" onclick="removeOperator(${opIdx})">×</button>
        </div>
      `;
    });
  } else {
    operatorsHtml = '<div style="color:#666; font-size:11px;">无需任何个体在场协助（可无人值守/自动合成）</div>';
  }

  let modeSpecificHtml = "";
  if (r.Type === 1) {
    let conditionsHtml = "";
    if (r.TransformationConditions && r.TransformationConditions.length > 0) {
      r.TransformationConditions.forEach((cond, cIdx) => {

              <option value="1" ${cond.Type === 1 ? 'selected' : ''}>辅料 (消耗)</option>
              <option value="5" ${cond.Type === 5 ? 'selected' : ''}>在场人员 (不消耗·无损耗)</option>
              <option value="2" ${cond.Type === 2 ? 'selected' : ''}>持续等待时间(分)</option>
              <option value="3" ${cond.Type === 3 ? 'selected' : ''}>环境特征门槛</option>
            </select>
            ${(cond.Type === 0 || cond.Type === 1 || cond.Type === 5) ? getItemSelectHtml(cond.TargetId, (val) => `updateCondField(${cIdx}, 'TargetId', '${val}')`) : ''}
            ${cond.Type === 0 ? `<span style="font-size:10px; color:#555;">损耗:</span><input type="number" value="${cond.DurabilityCost || 0}" min="0" placeholder="0" title="单次磨损(0=暂不设)" onchange="updateCondField(${cIdx}, 'DurabilityCost', parseInt(this.value)||0)" style="width:38px;">` : ''}
            ${cond.Type === 5 ? `<span style="font-size:10px; color:#777;">(不消耗·无损耗)</span>` : ''}
            ${cond.Type === 2 ? `<input type="number" value="${cond.Value || 1}" min="1" placeholder="分钟" onchange="updateCondField(${cIdx}, 'Value', parseInt(this.value)||1)" style="width:70px;">` : ''}
            ${cond.Type === 3 ? `<input type="text" value="${cond.TargetId || ''}" placeholder="环境标签 (如 高温/通风)" onchange="updateCondField(${cIdx}, 'TargetId', this.value)">` : ''}
            <input type="text" value="${cond.Note || ''}" placeholder="条件说明" onchange="updateCondField(${cIdx}, 'Note', this.value)">
            <button class="small danger" onclick="removeCondition(${cIdx})">×</button>
          </div>
        `;
      });

      conditionsHtml = '<div style="color:#666; font-size:11px;">当前无额外条件（在场所内放置即可自然发生）</div>';

    let byproductsHtml = "";

        byproductsHtml += `

            <button class="small danger" onclick="removeByproduct(${bIdx})">×</button>
          </div>
        `;
      });

    modeSpecificHtml = `
      <div class="group-box">
        <div class="group-box-title">自身转变主体（物品 A）</div>
        <div class="form-row">
          <label>源物品 (主体 A):</label>
          ${getItemSelectHtml(r.SourceItemId, (val) => `updateRecipeField('SourceItemId', '${val}')`)}
          <label style="width:60px;">消耗数量:</label>
          <input type="number" value="${r.SourceQuantity || 1}" min="1" onchange="updateRecipeField('SourceQuantity', parseInt(this.value)||1)" style="width:60px;">
        </div>
      </div>

      <div class="group-box">
        <div class="group-box-title">
          <span>转变附加条件列表（不限量）</span>
          <button class="small" onclick="addCondition()">+ 添加条件</button>
        </div>
        ${conditionsHtml}
      </div>

      <div class="group-box">
        <div class="group-box-title">转变生成目标（物品 B）与伴生副产物</div>
        <div class="form-row">
          <label>目标产物 (物品 B):</label>
          ${getItemSelectHtml(r.TargetItemId, (val) => `updateRecipeField('TargetItemId', '${val}')`)}

            <select onchange="updateInputField(${iIdx}, 'MatchType', parseInt(this.value)); renderRecipeDetail();" style="width:75px;">

    }

    let outputsHtml = "";

      r.Outputs.forEach((out, oIdx) => {
        const isBp = out.OutputType === 1 || out.IsByproduct === true;

function getItemSelectHtml(currentVal, onSelectExpr) {

      opts += `<option value="${it.Id}" ${it.Id === currentVal ? 'selected' : ''}>${it.Name} (${it.Id})</option>`;
    });
  }
  return `<select onchange="${onSelectExpr('this.value')}">${opts}</select>`.replace("'this.value'", "this.value");
}

function getTagSelectHtml(currentVal, onSelectExpr) {
  let opts = '<option value="">-- 选择标签 --</option>';

    db.Tags.forEach(tg => {
      opts += `<option value="${tg.Id}" ${tg.Id === currentVal ? 'selected' : ''}>#${tg.Name} (${tg.Id})</option>`;

}

}
function addNewRecipe(type) {
  if (!db.Recipes) db.Recipes = [];
  const prefix = type === 1 ? "trans_" : "recipe_";
  const newId = prefix + (db.Recipes.length + 1);
  const newRec = {
    Id: newId,
    Name: type === 1 ? "新自身转变配方" : "新合成配方",
    Type: type,
    LocationId: "",
    DurationMinutes: 0,
    Description: "",
    Operators: [],
    Inputs: type === 0 ? [{ MatchType: 0, TargetId: "", Quantity: 1, Consume: true }] : [],
    Outputs: type === 0 ? [{ ItemId: "", Quantity: 1, Chance: 1.0, IsByproduct: false }] : [],
    SourceItemId: "",
    SourceQuantity: 1,
    TransformationConditions: [],
    TargetItemId: "",
    TargetQuantity: 1,
    TransformationByproducts: []
  };
  db.Recipes.push(newRec);
  selectedRecipeIdx = db.Recipes.length - 1;
  autoSave();
  refreshAll();
}

function generateFormulaDisplay(r) {
  let str = "";
  if (r.AbilityChecks && r.AbilityChecks.length > 0) {
    str += "[能力检定: " + r.AbilityChecks.map(c => {
      const ab = db.Abilities ? db.Abilities.find(a => a.Id === c.AbilityId) : null;
      const abName = ab ? `${ab.IconOrEmoji || '⚡'}${ab.Name}` : c.AbilityId;
      return `${abName} ${c.Operator} ${c.RequiredValue}`;
    }).join(" 且 ") + "] ";
  }
  if (r.LocationId) {
    const loc = db.Locations ? db.Locations.find(l => l.Id === r.LocationId) : null;
    str += `[场所: ${loc ? loc.Name : r.LocationId}] `;
  }
  if (r.Operators && r.Operators.length > 0) {
    r.Operators.forEach(op => {
      let targetName = op.TargetId;
      if (op.MatchType === 1) {
        const tg = db.Tags ? db.Tags.find(t => t.Id === op.TargetId) : null;
        targetName = "#" + (tg ? tg.Name : op.TargetId);
      } else {
        const it = db.Items ? db.Items.find(i => i.Id === op.TargetId) : null;
        targetName = it ? it.Name : op.TargetId;
      }
      str += `[在场人员: ${targetName} x${op.Quantity}${op.Role ? `(${op.Role})` : ''} (不消耗·无损耗)] `;
    });
  }

  if (r.Type === 1) {
    const src = db.Items ? db.Items.find(i => i.Id === r.SourceItemId) : null;
    str += `[主体: ${src ? src.Name : (r.SourceItemId || '未选')} x${r.SourceQuantity || 1}]`;

    if (r.TransformationConditions) {
      r.TransformationConditions.forEach(c => {
        str += " + ";
        if (c.Type === 0) {
          const t = db.Items ? db.Items.find(i => i.Id === c.TargetId) : null;
          const wearTag = (c.DurabilityCost > 0) ? `损耗:${c.DurabilityCost}` : '可损耗·暂不设';
          str += `[工具: ${t ? t.Name : c.TargetId} (${wearTag})]`;
        } else if (c.Type === 1) {
          const m = db.Items ? db.Items.find(i => i.Id === c.TargetId) : null;
          str += `[辅料: ${m ? m.Name : c.TargetId} x${c.Value||1}]`;
        } else if (c.Type === 5) {
          const p = db.Items ? db.Items.find(i => i.Id === c.TargetId) : null;
          str += `[在场人员: ${p ? p.Name : c.TargetId} (不消耗·无损耗)]`;
        } else if (c.Type === 2) {
          str += `[等待 ${c.Value||1}分]`;
        } else if (c.Type === 3) {
          str += `[环境: ${c.TargetId}]`;
        }
      });
    }

    str += " ──▶ ";

    const dst = db.Items ? db.Items.find(i => i.Id === r.TargetItemId) : null;
    str += `[目标: ${dst ? dst.Name : (r.TargetItemId || '未选')} x${r.TargetQuantity || 1}]`;

    if (r.TransformationByproducts) {
      r.TransformationByproducts.forEach(bp => {
        const bi = db.Items ? db.Items.find(i => i.Id === bp.ItemId) : null;
        str += ` + [${bi ? bi.Name : bp.ItemId} x${bp.Quantity||1}(副产物)]`;
      });
    }
  } else {
    if (!r.Inputs || r.Inputs.length === 0) {
      str += "(无原料输入)";
    } else {
      str += r.Inputs.map(inp => {
        let name = inp.TargetId;
        if (inp.MatchType === 1) {
          const tg = db.Tags ? db.Tags.find(t => t.Id === inp.TargetId) : null;
          name = "#" + (tg ? tg.Name : inp.TargetId);
        } else {
          const it = db.Items ? db.Items.find(i => i.Id === inp.TargetId) : null;
          name = it ? it.Name : inp.TargetId;
        }
        if (inp.Consume) {
          return `[${name} x${inp.Quantity}]`;
        } else {
          const wearTag = (inp.DurabilityCost > 0) ? `损耗:${inp.DurabilityCost}` : '可损耗·暂不设';
          return `[${name} x${inp.Quantity} (工具·${wearTag})]`;
        }
      }).join(" + ");
    }

    str += " ──▶ ";

    if (!r.Outputs || r.Outputs.length === 0) {
      str += "(无产出物)";
    } else {
      str += r.Outputs.map(out => {
        const it = db.Items ? db.Items.find(i => i.Id === out.ItemId) : null;
        const isBp = out.OutputType === 1 || out.IsByproduct === true;
        const typeTag = isBp ? '(副产物)' : '(主产物)';
        const chanceStr = (out.Chance !== undefined && out.Chance < 1) ? `(${Math.round(out.Chance*100)}%)` : '';
        return `[${it ? it.Name : out.ItemId} x${out.Quantity}${chanceStr}${typeTag}]`;
      }).join(" + ");
    }
  }

  return str;
}

// ==================== 选项卡 4: 副产线管理（伴生修正、概率覆盖与产出拦截） ====================
function renderAuxList() {
  const box = document.getElementById("auxListBox");
  if (!box) return;
  box.innerHTML = "";
  const filter = (document.getElementById("auxSearch") ? document.getElementById("auxSearch").value : "").toLowerCase();

  if (!db.AuxiliaryLines) db.AuxiliaryLines = [];
  db.AuxiliaryLines.forEach((line, idx) => {
    if (filter) {
      const match = (line.Name && line.Name.toLowerCase().includes(filter)) ||
                    (line.Id && line.Id.toLowerCase().includes(filter));
      if (!match) return;
    }

    const div = document.createElement("div");
    div.className = "list-item" + (selectedAuxIdx === idx ? " selected" : "");
    const hasPrevention = line.OutputModifiers && line.OutputModifiers.some(m => (m.Chance || 0) <= 0.0001);

    div.innerHTML = `
      <span>${line.Name || line.Id}</span>
      <span style="font-size:10px; opacity:0.8;">
        ${hasPrevention ? '<span class="badge" style="background:#c0392b;">🛡️含拦截</span>' : '<span class="badge" style="background:#2980b9;">⚡伴生产出</span>'}
      </span>
    `;
    div.onclick = () => {
      selectedAuxIdx = idx;
      renderAuxList();
      renderAuxDetail();
    };
    box.appendChild(div);
  });
}

function renderAuxDetail() {
  const panel = document.getElementById("auxDetailPanel");
  if (!panel) return;
  if (selectedAuxIdx < 0 || !db.AuxiliaryLines || !db.AuxiliaryLines[selectedAuxIdx]) {
    panel.innerHTML = '<div style="color:#666; text-align:center; margin-top:50px;">请在左侧选择或新建一条副产线规则</div>';
    return;
  }

  const line = db.AuxiliaryLines[selectedAuxIdx];
  if (!line.MatchTagIds) line.MatchTagIds = [];
  if (!line.MatchItemIds) line.MatchItemIds = [];
  if (!line.MatchLocationIds) line.MatchLocationIds = [];

  if (!line.OutputModifiers) line.OutputModifiers = [];

    const tg = db.Tags ? db.Tags.find(t => t.Id === tId) : null;
    return `<span class="badge" style="background:#2c3e50; margin:2px;">#${tg ? tg.Name : tId} <a href="javascript:void(0)" onclick="removeAuxMatchTag(${idx})" style="color:#ff7675; text-decoration:none; font-weight:bold; margin-left:4px;">×</a></span>`;
  }).join("") || '<span style="color:#888; font-size:11px;">(未限制标签，匹配任意标签)</span>';

  }).join("") || '<span style="color:#888; font-size:11px;">(未限制特定原料物品)</span>';

      <span style="width:40px; font-size:11px; color:#555;">投入 ${idx+1}:</span>

      <input type="number" value="${inp.Quantity || 1}" min="1" placeholder="数量" onchange="updateAuxInputField(${idx}, 'Quantity', parseInt(this.value)||1)" style="width:45px;">
      <select onchange="updateAuxInputField(${idx}, 'Consume', this.value === '1'); renderAuxDetail();" style="width:110px;">

function generateAuxFormulaDisplay(line) {
  let str = "";
  const condParts = [];
  if (line.MatchTagIds && line.MatchTagIds.length > 0) {
    line.MatchTagIds.forEach(tId => {
      const tg = db.Tags ? db.Tags.find(t => t.Id === tId) : null;
      condParts.push(`#${tg ? tg.Name : tId}`);
    });
  }
  if (line.MatchItemIds && line.MatchItemIds.length > 0) {
    line.MatchItemIds.forEach(iId => {
      const it = db.Items ? db.Items.find(i => i.Id === iId) : null;
      condParts.push(`物品:${it ? it.Name : iId}`);
    });
  }
  if (line.MatchLocationIds && line.MatchLocationIds.length > 0) {
    line.MatchLocationIds.forEach(lId => {
      const lc = db.Locations ? db.Locations.find(l => l.Id === lId) : null;
      condParts.push(`工位:${lc ? lc.Name : lId}`);
    });
  }

  const opStr = line.MatchCombineMode === 1 ? " 且 " : " 或 ";
  str += `[匹配: ${condParts.length > 0 ? condParts.join(opStr) : "任意配方"}]`;

  if (line.ExtraInputs && line.ExtraInputs.length > 0) {
    str += " + [额外投入: ";
    str += line.ExtraInputs.map(inp => {
      let name = inp.TargetId;
      if (inp.MatchType === 1) {
        const tg = db.Tags ? db.Tags.find(t => t.Id === inp.TargetId) : null;
        name = "#" + (tg ? tg.Name : inp.TargetId);
      } else {
        const it = db.Items ? db.Items.find(i => i.Id === inp.TargetId) : null;
        name = it ? it.Name : inp.TargetId;
      }
      const wearTag = !inp.Consume ? ((inp.DurabilityCost || 0) > 0 ? `(损耗:${inp.DurabilityCost})` : '(非耗材)') : '(消耗)';
      return `${name} x${inp.Quantity}${wearTag}`;
    }).join(" + ");
    str += "]";
  }

  str += " ──▶ ";

  if (line.SuppressBaseOutputs) {
    str += "[🚫阻断宿主全部原产出] ";
  }

  if (!line.OutputModifiers || line.OutputModifiers.length === 0) {
    str += "(无附加产出修饰)";
  } else {
    str += line.OutputModifiers.map(mod => {
      const it = db.Items ? db.Items.find(i => i.Id === mod.ItemId) : null;
      const isPrev = (mod.Chance || 0) <= 0.0001;
      if (isPrev) {
        return `[🛡️拦截防止: ${it ? it.Name : mod.ItemId} (0%)]`;
      } else {
        const typeStr = mod.OutputType === 0 ? '★主产物' : '⚑副产物';
        const chanceStr = (mod.Chance !== undefined && mod.Chance < 0.999) ? `(${Math.round(mod.Chance*100)}%)` : '(100%)';
        return `[${it ? it.Name : mod.ItemId} x${mod.Quantity}${chanceStr} ${typeStr}]`;
      }
    }).join(" + ");
  }

  return str;
}

  } else {

      checkListHtml += `

        <span>• 标签总数: ${db.Tags ? db.Tags.length : 0}</span>
        <span>• 能力总数: ${db.Abilities ? db.Abilities.length : 0}</span>

    <div class="group-box">

function runValidationCheck() {
  const issues = [];
  const tagIds = new Set();
  const itemIds = new Set();
  const locIds = new Set();
  const recipeIds = new Set();

  if (db.Tags) {
    db.Tags.forEach(t => {
      if (!t.Id) issues.push({ type: "error", source: "Tag", id: t.Name, msg: "标签 ID 不能为空" });
      else if (tagIds.has(t.Id)) issues.push({ type: "error", source: "Tag", id: t.Id, msg: "重复的标签 ID" });
      else tagIds.add(t.Id);
    });
  }

  const abilityIds = new Set();
  if (db.Abilities) {
    db.Abilities.forEach(a => {
      if (!a.Id) issues.push({ type: "error", source: "Ability", id: a.Name, msg: "能力 ID 不能为空" });
      else if (abilityIds.has(a.Id)) issues.push({ type: "error", source: "Ability", id: a.Id, msg: "重复的能力 ID" });
      else abilityIds.add(a.Id);
    });
  }

  if (db.Items) {
    db.Items.forEach(i => {
      if (!i.Id) issues.push({ type: "error", source: "Item", id: i.Name, msg: "物品 ID 不能为空" });
      else if (itemIds.has(i.Id)) issues.push({ type: "error", source: "Item", id: i.Id, msg: "重复的物品 ID" });
      else itemIds.add(i.Id);

      if (i.TagIds) {
        i.TagIds.forEach(tid => {
          if (!tagIds.has(tid)) issues.push({ type: "error", source: "Item", id: i.Id, msg: `引用的标签 ID [${tid}] 不存在` });
        });
      }
      if (i.AbilityContributions) {
        i.AbilityContributions.forEach(ac => {
          if (!ac.AbilityId) issues.push({ type: "warning", source: "Item", id: i.Id, msg: "能力点数未指定能力 ID" });
          else if (abilityIds.size > 0 && !abilityIds.has(ac.AbilityId)) issues.push({ type: "warning", source: "Item", id: i.Id, msg: `挂载的能力 [${ac.AbilityId}] 未在能力池中定义` });
        });
      }
    });
  }

  if (db.Locations) {
    db.Locations.forEach(l => {
      if (!l.Id) issues.push({ type: "error", source: "Location", id: l.Name, msg: "场所 ID 不能为空" });
      else if (locIds.has(l.Id)) issues.push({ type: "error", source: "Location", id: l.Id, msg: "重复的场所 ID" });
      else locIds.add(l.Id);

      if (l.SourceType === 1 && (!l.BoundItemId || !itemIds.has(l.BoundItemId))) {
        issues.push({ type: "error", source: "Location", id: l.Id, msg: `关联的物品 ID [${l.BoundItemId}] 在物品库中不存在` });
      }
    });
  }

  if (db.Recipes) {
    db.Recipes.forEach(r => {
      if (!r.Id) issues.push({ type: "error", source: "Recipe", id: r.Name, msg: "配方 ID 不能为空" });
      else if (recipeIds.has(r.Id)) issues.push({ type: "error", source: "Recipe", id: r.Id, msg: "重复的配方 ID" });
      else recipeIds.add(r.Id);

      if (r.LocationId && !locIds.has(r.LocationId)) {
        issues.push({ type: "error", source: "Recipe", id: r.Id, msg: `发生场所 ID [${r.LocationId}] 不存在` });
      }

      if (r.AbilityChecks) {
        r.AbilityChecks.forEach(chk => {
          if (!chk.AbilityId) issues.push({ type: "error", source: "Recipe", id: r.Id, msg: "检定项未指定能力 ID" });
          else if (abilityIds.size > 0 && !abilityIds.has(chk.AbilityId)) issues.push({ type: "warning", source: "Recipe", id: r.Id, msg: `检定的能力 [${chk.AbilityId}] 未在能力池中定义` });
        });
      }

      if (r.Operators) {
        r.Operators.forEach(op => {
          if (op.MatchType === 0 && !itemIds.has(op.TargetId)) issues.push({ type: "error", source: "Recipe", id: r.Id, msg: `在场个体物品 [${op.TargetId}] 不存在` });
          if (op.MatchType === 1 && !tagIds.has(op.TargetId)) issues.push({ type: "error", source: "Recipe", id: r.Id, msg: `在场个体标签 [${op.TargetId}] 不存在` });
        });
      }

      if (r.Type === 1) {
        if (!r.SourceItemId || !itemIds.has(r.SourceItemId)) issues.push({ type: "error", source: "Recipe", id: r.Id, msg: `转变源物品 [${r.SourceItemId}] 不存在` });
        if (!r.TargetItemId || !itemIds.has(r.TargetItemId)) issues.push({ type: "error", source: "Recipe", id: r.Id, msg: `转变目标物品 [${r.TargetItemId}] 不存在` });
      } else {
        if (!r.Inputs || r.Inputs.length === 0) issues.push({ type: "warning", source: "Recipe", id: r.Id, msg: "等式左侧无原料输入" });
        if (!r.Outputs || r.Outputs.length === 0) issues.push({ type: "warning", source: "Recipe", id: r.Id, msg: "等式右侧无产出物" });
      }
    });
  }

  if (db.AuxiliaryLines) {
    const auxIds = new Set();
    db.AuxiliaryLines.forEach(a => {
      if (!a.Id) issues.push({ type: "error", source: "AuxiliaryLine", id: a.Name || "未命名", msg: "副产线 ID 不能为空" });
      else if (auxIds.has(a.Id)) issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: "重复的副产线 ID" });
      else auxIds.add(a.Id);

      if (a.MatchTagIds) {
        a.MatchTagIds.forEach(tId => {
          if (!tagIds.has(tId)) issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: `匹配的标签 [${tId}] 在标签池中不存在` });
        });
      }
      if (a.MatchItemIds) {
        a.MatchItemIds.forEach(iId => {
          if (!itemIds.has(iId)) issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: `匹配的物品 [${iId}] 在物品库中不存在` });
        });
      }
      if (a.MatchLocationIds) {
        a.MatchLocationIds.forEach(lId => {
          if (!locIds.has(lId)) issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: `匹配的工位场所 [${lId}] 不存在` });
        });
      }
      if (a.ExtraInputs) {
        a.ExtraInputs.forEach(inp => {
          if (inp.MatchType === 0 && inp.TargetId && !itemIds.has(inp.TargetId)) {
            issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: `额外投入物品 [${inp.TargetId}] 不存在` });
          }
          if (inp.MatchType === 1 && inp.TargetId && !tagIds.has(inp.TargetId)) {
            issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: `额外投入标签 [${inp.TargetId}] 不存在` });
          }
        });
      }
      if (a.OutputModifiers) {
        a.OutputModifiers.forEach(m => {
          if (m.ItemId && !itemIds.has(m.ItemId)) {
            issues.push({ type: "error", source: "AuxiliaryLine", id: a.Id, msg: `产物修饰目标物品 [${m.ItemId}] 在物品库中不存在` });
          }
        });
      }
    });
  }

  return issues;
}

function validateDatabase(switchTabFlag) {
  if (switchTabFlag) switchTab(6);
  renderOverview();
  const count = runValidationCheck().length;
  setStatus(`完整性校验完成，发现 ${count} 项问题。`);
}

function jumpToValidationSource(source, id) {
  if (source === "Item") {
    jumpToItem(id);
  } else if (source === "Tag") {
    const idx = db.Tags.findIndex(t => t.Id === id);
    if (idx >= 0) { selectedTagIdx = idx; switchTab(1); renderTagList(); }
  } else if (source === "Ability") {
    const idx = db.Abilities ? db.Abilities.findIndex(a => a.Id === id) : -1;
    if (idx >= 0) { selectedAbilityIdx = idx; switchTab(2); renderAbilityList(); renderAbilityDetail(); }
  } else if (source === "Location") {
    jumpToLocation(id);
  } else if (source === "Recipe") {
    jumpToRecipe(id);
  } else if (source === "AuxiliaryLine") {
    jumpToAux(id);
  }
}

function exportJsonFile() {

  const blob = new Blob([jsonStr], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${db.DatabaseName || '配方数据库'}.json`;
  a.click();
  URL.revokeObjectURL(url);
  setStatus(`已导出 JSON 文件: ${a.download}`);
}

function importJsonFile() {
  document.getElementById("fileInput").click();
}

function handleFileSelected(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const imported = JSON.parse(e.target.result);
      const isMerge = confirm("点击【确定】进行增量合并导入；点击【取消】完全覆盖当前数据。");
      if (isMerge) {
        mergeDatabase(imported);
        setStatus(`增量合并导入完成: ${file.name}`);
      } else {
        db = imported;
        setStatus(`完全覆盖载入文件: ${file.name}`);
      }
      autoSave();
      refreshAll();
    } catch(err) {
      alert("解析 JSON 文件失败: " + err.message);
    }
  };
  reader.readAsText(file);
  event.target.value = "";
}

function mergeDatabase(source) {
  if (!db.Tags) db.Tags = [];
  if (!db.Items) db.Items = [];
  if (!db.Locations) db.Locations = [];
  if (!db.Recipes) db.Recipes = [];

  if (source.Tags) {
    source.Tags.forEach(st => {
      const ex = db.Tags.find(t => t.Id === st.Id);
      if (!ex) db.Tags.push(st);
      else Object.assign(ex, st);
    });
  }
  if (source.Abilities) {
    if (!db.Abilities) db.Abilities = [];
    source.Abilities.forEach(sa => {
      const ex = db.Abilities.find(a => a.Id === sa.Id);
      if (!ex) db.Abilities.push(sa);
      else Object.assign(ex, sa);
    });
  }
  if (source.Items) {
    source.Items.forEach(si => {
      const ex = db.Items.find(i => i.Id === si.Id);
      if (!ex) db.Items.push(si);
      else Object.assign(ex, si);
    });
  }
  if (source.Locations) {
    source.Locations.forEach(sl => {
      const ex = db.Locations.find(l => l.Id === sl.Id);
      if (!ex) db.Locations.push(sl);
      else Object.assign(ex, sl);
    });
  }
  if (source.Recipes) {
    source.Recipes.forEach(sr => {
      const ex = db.Recipes.find(r => r.Id === sr.Id);
      if (!ex) db.Recipes.push(sr);
      else Object.assign(ex, sr);
    });
  }
  if (source.AuxiliaryLines) {
    if (!db.AuxiliaryLines) db.AuxiliaryLines = [];
    source.AuxiliaryLines.forEach(sa => {
      const ex = db.AuxiliaryLines.find(a => a.Id === sa.Id);
      if (!ex) db.AuxiliaryLines.push(sa);
      else Object.assign(ex, sa);
    });
  }
}
